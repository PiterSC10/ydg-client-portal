<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Área de clientes · YourDesignGPT</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#030b13;color:#effaff;font-family:Inter,system-ui,Arial;display:grid;place-items:center;padding:24px}.wrap{width:min(720px,100%)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.brand-home{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none}.brand-home:hover b{color:#fff}.brand-home:focus-visible{outline:2px solid rgba(34,211,238,.55);outline-offset:5px;border-radius:14px}.logo{width:42px;height:42px;border:1px solid rgba(34,211,238,.2);border-radius:13px;display:grid;place-items:center;font-weight:900}.card{padding:40px;border:1px solid rgba(34,211,238,.18);border-radius:28px;background:linear-gradient(145deg,#071522,#03101a)}.k{color:#22d3ee;font-size:.68rem;letter-spacing:.18em;font-weight:900}h1{font-size:clamp(2.4rem,8vw,5rem);line-height:.94;margin:14px 0}.g{background:linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}p{color:#8ba1b4;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#70889d;font-size:.6rem;font-weight:900;margin-bottom:7px}input{width:100%;padding:15px;border:1px solid rgba(56,189,248,.15);border-radius:14px;background:#04111c;color:white;outline:none}button{width:100%;margin-top:16px;padding:16px;border:0;border-radius:15px;background:linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899);color:#041019;font-weight:1000;cursor:pointer}.msg{min-height:22px;margin-top:12px;color:#8298aa;font-size:.72rem}.error{color:#ff8698}.ok{color:#4ff0aa}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body>
<div class="wrap"><div class="brand"><a class="brand-home" href="https://pitersc10.github.io/yourdesigngpt/" aria-label="Volver a YourDesignGPT"><div class="logo">YDG</div><div><b>YourDesignGPT</b><small style="display:block;color:#60778b">CLIENT ACCESS</small></div></a></div>
<section class="card"><div class="k">YDG CLIENT PORTAL</div><h1>Accede a tu <span class="g">proyecto.</span></h1><p>Introduce el ID y el código de acceso que te ha facilitado YourDesignGPT.</p>
<form id="f"><div class="grid"><div><label>ID DEL PROYECTO</label><input id="pid" placeholder="YDG-001" required></div><div><label>CÓDIGO DE ACCESO</label><input id="code" type="password" required></div></div><button>ENTRAR A MI PROYECTO →</button><div id="msg" class="msg"></div></form></section></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),norm=v=>String(v||'').trim().toUpperCase();
$('f').addEventListener('submit',async e=>{e.preventDefault();$('msg').className='msg';$('msg').textContent='Comprobando acceso…';const id=norm($('pid').value),code=String($('code').value||'').trim();
try{const r=await fetch('./projects.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();const arr=Array.isArray(d)?d:(d.projects||[]);const p=arr.find(x=>norm(x.id||x.projectId)===id);
if(!p||String(p.accessCode||'')!==code){$('msg').className='msg error';$('msg').textContent='ID o código incorrecto.';return}
sessionStorage.setItem('ydg_access_'+id,'1');$('msg').className='msg ok';$('msg').textContent='Acceso correcto…';setTimeout(()=>location.href='./project.html?project='+encodeURIComponent(id),400)}
catch(err){$('msg').className='msg error';$('msg').textContent='No se pudo validar el acceso.'}})})();
</script></body></html>
