<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>YDG Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#020a12;color:#effaff;font-family:Inter,system-ui,Arial}.top{padding:16px 22px;border-bottom:1px solid rgba(34,211,238,.12);display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:900}.shell{width:min(1220px,calc(100% - 28px));margin:28px auto}.hero,.card{border:1px solid rgba(34,211,238,.16);background:linear-gradient(145deg,#071522,#03101a);border-radius:24px}.hero{padding:28px}.hero h1{font-size:clamp(2.5rem,6vw,5rem);line-height:.94;margin:10px 0}.grad{background:linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}.toolbar{margin:16px 0;padding:14px;display:flex;gap:10px}.btn,.new{border:1px solid rgba(56,189,248,.16);background:#071827;color:#ccefff;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.new{border:0;background:linear-gradient(90deg,#22d3ee,#8b5cf6,#d84fdf);color:#031019}.search{flex:1;border:1px solid rgba(56,189,248,.14);background:#04111c;color:white;border-radius:12px;padding:12px}.list{display:grid;gap:14px}.project{padding:20px}.row{display:flex;justify-content:space-between;gap:12px}.pid{color:#22d3ee;font-size:.65rem;font-weight:900}.client{font-size:1.2rem;font-weight:900}.state{font-size:.58rem;color:#8fa8bc}.chips,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{padding:7px 9px;border:1px solid rgba(56,189,248,.11);border-radius:9px;color:#7895aa;font-size:.55rem}.actions button{padding:9px 11px;border:1px solid rgba(56,189,248,.14);background:#071827;color:#cbe9fa;border-radius:10px;font-weight:900;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);place-items:center;padding:20px}.modal.show{display:grid}.box{width:min(720px,100%);max-height:90vh;overflow:auto;padding:24px;background:#06131f;border:1px solid rgba(34,211,238,.18);border-radius:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:.58rem;color:#718a9f;font-weight:900;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid rgba(56,189,248,.14);border-radius:12px;background:#03101a;color:white}.span2{grid-column:1/-1}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}.toolbar{flex-wrap:wrap}.search{min-width:100%}}</style></head><body>
<header class="top"><div class="brand">YDG · YourDesignGPT Admin</div><div><span id="conn">GitHub no conectado</span> <button class="btn" id="connect">Conectar GitHub</button></div></header>
<main class="shell"><section class="hero"><small style="color:#22d3ee;font-weight:900">YDG ADMIN</small><h1>Controla tus proyectos <span class="grad">con un clic.</span></h1></section>
<section class="card toolbar"><button class="new" id="new">+ NUEVO PROYECTO</button><input class="search" id="search" placeholder="Buscar ID o cliente…"><button class="btn" id="refresh">↻ Actualizar</button></section><section class="list" id="list"></section></main>
<div class="modal" id="cm"><div class="box"><h2>Conectar GitHub</h2><div class="grid"><div class="field"><label>OWNER</label><input id="owner" value="pitersc10"></div><div class="field"><label>REPOSITORIO</label><input id="repo" value="ydg-client-portal"></div><div class="field"><label>BRANCH</label><input id="branch" value="main"></div><div class="field"><label>ARCHIVO</label><input id="file" value="projects.json"></div><div class="field span2"><label>FINE-GRAINED PAT</label><input id="token" type="password"></div></div><p style="color:#7e96aa">El token se guarda solo durante esta sesión del navegador.</p><div class="ma"><button class="btn" data-close="cm">Cancelar</button><button class="new" id="saveConn">Conectar</button></div></div></div>
<div class="modal" id="em"><div class="box"><h2 id="title">Proyecto</h2><div class="grid"><div class="field"><label>ID</label><input id="fid"></div><div class="field"><label>CLIENTE</label><input id="fclient"></div><div class="field"><label>CÓDIGO DE ACCESO</label><input id="fcode"></div><div class="field"><label>ESTADO</label><select id="fstatus"><option value="accepted">Proyecto aceptado</option><option value="paid99">99 € pagado</option><option value="development">Diseño y desarrollo</option><option value="preview">Preview disponible</option><option value="paid100">100 €/año pagado</option><option value="online">Web online</option></select></div><div class="field span2"><label>URL PREVIEW</label><input id="fpreview"></div><div class="field span2"><label>URL WEB FINAL</label><input id="fwebsite"></div></div><div class="ma"><button class="btn" id="del">Eliminar</button><button class="btn" data-close="em">Cancelar</button><button class="new" id="save">Guardar proyecto</button></div></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let projects=[],editing=null,sha='';
const cfg=()=>({owner:sessionStorage.getItem('ydg_owner')||'pitersc10',repo:sessionStorage.getItem('ydg_repo')||'ydg-client-portal',branch:sessionStorage.getItem('ydg_branch')||'main',file:sessionStorage.getItem('ydg_file')||'projects.json',token:sessionStorage.getItem('ydg_token')||''});
const open=id=>$(id).classList.add('show'),close=id=>$(id).classList.remove('show');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));
function code(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s.slice(0,4)+'-'+s.slice(4)}
function nextId(){let m=0;projects.forEach(p=>{const x=String(p.id||'').match(/YDG-(\d+)/i);if(x)m=Math.max(m,+x[1])});return 'YDG-'+String(m+1).padStart(3,'0')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function label(s){return ({accepted:'PROYECTO ACEPTADO',paid99:'99 € PAGADO',development:'EN DESARROLLO',preview:'PREVIEW',paid100:'100 €/AÑO PAGADO',online:'WEB ONLINE'})[s]||s}
function render(){const q=$('search').value.toLowerCase();$('list').innerHTML=projects.filter(p=>!q||p.id.toLowerCase().includes(q)||p.client.toLowerCase().includes(q)).map(p=>`<article class="card project" data-id="${esc(p.id)}"><div class="row"><div><div class="pid">${esc(p.id)}</div><div class="client">${esc(p.client)}</div></div><div class="state">${esc(label(p.status))}</div></div><div class="chips"><span class="chip">Código · ${esc(p.accessCode||'—')}</span><span class="chip">${p.preview?'Preview lista':'Sin preview'}</span><span class="chip">${p.website?'Web final':'Sin web final'}</span></div><div class="actions"><button data-a="next">Avanzar →</button><button data-a="edit">Editar</button><button data-a="copy">Copiar acceso</button><button data-a="view">Ver cliente</button></div></article>`).join('')}
async function api(opt={}){const c=cfg(),u=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.file}${opt.q||''}`;const r=await fetch(u,{method:opt.method||'GET',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:opt.body});if(!r.ok)throw new Error('GitHub '+r.status);return r.json()}
async function load(){if(!cfg().token){const r=await fetch('./projects.json?ts='+Date.now(),{cache:'no-store'}),d=await r.json();projects=Array.isArray(d)?d:(d.projects||[]);render();return}const c=cfg(),d=await api({q:'?ref='+c.branch});sha=d.sha;const txt=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));const j=JSON.parse(txt);projects=Array.isArray(j)?j:(j.projects||[]);$('conn').textContent='ydg-client-portal · conectado';render()}
async function saveAll(msg){const c=cfg();if(!c.token)throw new Error('Conecta GitHub');const raw=unescape(encodeURIComponent(JSON.stringify({projects},null,2)));const body=JSON.stringify({message:msg,content:btoa(raw),branch:c.branch,sha});const d=await api({method:'PUT',body});sha=d.content.sha}
$('connect').onclick=()=>{const c=cfg();$('owner').value=c.owner;$('repo').value=c.repo;$('branch').value=c.branch;$('file').value=c.file;$('token').value=c.token;open('cm')};$('saveConn').onclick=async()=>{sessionStorage.setItem('ydg_owner',$('owner').value.trim());sessionStorage.setItem('ydg_repo',$('repo').value.trim());sessionStorage.setItem('ydg_branch',$('branch').value.trim());sessionStorage.setItem('ydg_file',$('file').value.trim());sessionStorage.setItem('ydg_token',$('token').value.trim());try{await load();close('cm')}catch(e){alert(e.message)}};
function fill(p){$('fid').value=p.id||'';$('fclient').value=p.client||'';$('fcode').value=p.accessCode||code();$('fstatus').value=p.status||'accepted';$('fpreview').value=p.preview||'';$('fwebsite').value=p.website||''}
$('new').onclick=()=>{editing=null;$('title').textContent='Nuevo proyecto';fill({id:nextId(),accessCode:code()});open('em')};
$('save').onclick=async()=>{const p={id:$('fid').value.trim().toUpperCase(),client:$('fclient').value.trim(),accessCode:$('fcode').value.trim(),status:$('fstatus').value,preview:$('fpreview').value.trim(),website:$('fwebsite').value.trim(),createdAt:editing?.createdAt||new Date().toISOString()};if(!p.id||!p.client||!p.accessCode){alert('Faltan datos');return}if(editing)Object.assign(editing,p);else projects.push(p);try{await saveAll('Actualizar '+p.id);editing=p;render();close('em')}catch(e){alert(e.message)}};
$('del').onclick=async()=>{if(!editing||!confirm('¿Eliminar proyecto?'))return;projects=projects.filter(x=>x!==editing);try{await saveAll('Eliminar '+editing.id);close('em');render()}catch(e){alert(e.message)}};
$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('search').oninput=render;
$('list').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const p=projects.find(x=>x.id===e.target.closest('[data-id]').dataset.id);const a=b.dataset.a;if(a==='edit'){editing=p;$('title').textContent='Editar '+p.id;fill(p);open('em')}if(a==='copy'){const t=`YourDesignGPT · Acceso a tu proyecto\n\nPortal:\n${location.origin+location.pathname.replace(/admin\.html.*$/,'login.html')}\n\nProyecto: ${p.id}\nCódigo: ${p.accessCode}`;await navigator.clipboard.writeText(t);alert('Acceso copiado')}if(a==='view'){sessionStorage.setItem('ydg_access_'+p.id,'1');location.href='./project.html?project='+encodeURIComponent(p.id)}if(a==='next'){const o=['accepted','paid99','development','preview','paid100','online'];let i=o.indexOf(p.status);if(i<o.length-1)p.status=o[i+1];try{await saveAll('Avanzar '+p.id);render()}catch(err){alert(err.message)}}};
load().catch(()=>{})})();
</script></body></html>
